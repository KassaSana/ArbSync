[detector]
threshold_pct = 0.1

[exchanges]
gemini = ["btcusd", "ethusd", "solusd", "avaxusd", "linkusd", "ltcusd", "uniusd", "dotusd", "aaveusd"]
coinbase = ["BTC-USD", "ETH-USD", "SOL-USD", "AVAX-USD", "LINK-USD", "LTC-USD", "UNI-USD", "DOT-USD", "AAVE-USD"]
binance = ["BTCUSDT", "ETHUSDT", "SOLUSDT", "AVAXUSDT", "LINKUSDT", "LTCUSDT", "UNIUSDT", "DOTUSDT", "AAVEUSDT"]

[server]
host = "127.0.0.1"
port = 8000
database_path = "var/arb.sqlite3"
# Browser origins permitted to call the API. Public deployments must replace
# these local development origins or set ARB_CORS_ALLOWED_ORIGINS.
cors_allowed_origins = ["http://localhost:5173", "http://127.0.0.1:5173"]

[persistence]
batch_size = 500
flush_interval_seconds = 1.0
queue_maxsize = 10000

[order_books]
# Books older than this stop contributing to detection, readiness, metrics, and
# dashboard spreads. Omitting this section falls back to the stricter 30.0s
# built into `load_config`, not to the value shipped here.
max_age_seconds = 60.0
