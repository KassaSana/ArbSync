# ArbSync uses public market-data feeds and does not require exchange credentials.
[detector]
threshold_pct = 0.1

[exchanges]
gemini = ["btcusd", "ethusd"]
coinbase = ["BTC-USD", "ETH-USD"]
# Binance.US lists both USD and USDT markets. USD matches the other venues' quote asset;
# USDT symbols are accepted but form a separate market that is never compared with USD.
binance = ["BTCUSD", "ETHUSD"]

[server]
# Loopback is the safe default. Use a terminating reverse proxy for public hosting.
host = "127.0.0.1"
port = 8000
# Relative paths are resolved from this configuration file's directory.
database_path = "var/arb.sqlite3"
cors_allowed_origins = ["http://localhost:5173", "http://127.0.0.1:5173"]

[persistence]
batch_size = 500
flush_interval_seconds = 1.0
queue_maxsize = 10000

[order_books]
max_age_seconds = 60.0

[capture]
# Bounded frames waiting for disk; a full queue drops capture frames and
# counts them instead of blocking ingestion.
queue_maxsize = 10000

[reconciliation]
# Checks are spread across the cycle rather than launched as one REST burst.
cycle_seconds = 60.0
confirmation_count = 3
# Size is more volatile than price across non-atomic REST/live observations.
size_confirmation_count = 5
# Also serves as the deadline for reporting a started recovery as unresolved.
cooldown_seconds = 300.0

[pricing]
# Quote notionals, in each pair's quote asset, walked to a VWAP per venue and
# side. Books are sampled on this interval, off the ingestion path, to build
# per-venue fill rates. Omitting this section uses these same values.
notionals = [100, 1000, 10000, 50000]
sample_interval_seconds = 5.0

[fees]
# Per-venue taker fee as a percent of notional per side, charged once on each
# leg when a spread is netted. Every exchange in [exchanges] must have an entry;
# there is no default because a silent zero would be persisted as if real.
# maker_pct is accepted and validated but unused until something consumes it.
# These are illustrative base-tier public schedules, not live quotes.
gemini = { taker_pct = 0.40 }
coinbase = { taker_pct = 0.60 }
binance = { taker_pct = 0.60 }
