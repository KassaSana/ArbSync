repos:
  - repo: local
    hooks:
      - id: whitespace-check
        name: whitespace-check
        entry: git diff --cached --check
        language: system
        pass_filenames: false
        always_run: true

      - id: ruff-check
        name: ruff-check
        entry: python tools/run_backend_tool.py ruff check server
        language: system
        pass_filenames: false
        files: ^(server/|pyproject\.toml)

      - id: ruff-format
        name: ruff-format
        entry: python tools/run_backend_tool.py ruff format --check server
        language: system
        pass_filenames: false
        files: ^(server/|pyproject\.toml)

      - id: mypy
        name: mypy
        entry: python tools/run_backend_tool.py mypy --strict server/arb
        language: system
        pass_filenames: false
        files: ^(server/|pyproject\.toml)

      - id: dashboard-eslint
        name: dashboard-eslint
        entry: npm --prefix dashboard run lint
        language: system
        pass_filenames: false
        files: ^dashboard/

      - id: dashboard-typecheck
        name: dashboard-typecheck
        entry: npm --prefix dashboard run typecheck
        language: system
        pass_filenames: false
        files: ^dashboard/
