<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="780" viewBox="0 0 1500 780" role="img" aria-labelledby="title description">
  <title id="title">ArbSync architecture</title>
  <desc id="description">Public exchange feeds pass through exchange adapters, the canonical order-book eligibility gate, and theoretical arbitrage detection. Bounded persistence and API delivery feed SQLite and the React dashboard.</desc>

  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M1 1 L10 6 L1 11" fill="none" stroke="#27272a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      text { font-family: "Segoe Print", "Comic Sans MS", sans-serif; fill: #27272a; }
      .title { font-size: 30px; font-weight: 700; }
      .heading { font-size: 21px; font-weight: 700; }
      .label { font-size: 15px; }
      .small { font-size: 13px; fill: #52525b; }
      .box { fill: #fafafa; stroke: #27272a; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
      .inner { fill: #ffffff; stroke: #71717a; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
      .accent { fill: #eff6ff; stroke: #2563eb; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
      .accent-text { fill: #1d4ed8; }
      .rough { fill: none; stroke: #27272a; stroke-width: 1; opacity: 0.16; stroke-linecap: round; stroke-linejoin: round; }
      .flow { fill: none; stroke: #27272a; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow); }
      .branch { fill: none; stroke: #71717a; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1500" height="780" fill="#ffffff"/>

  <text x="48" y="58" class="title">ArbSync data flow</text>
  <text x="48" y="86" class="small">trusted books in memory · theoretical opportunities only</text>

  <!-- Public exchange feeds -->
  <path class="box" d="M48 145 C103 142 226 147 280 144 L282 426 C224 430 105 425 50 429 Z"/>
  <path class="rough" d="M52 149 C111 146 224 151 276 148 L278 422 C217 426 109 421 54 425 Z"/>
  <text x="165" y="180" text-anchor="middle" class="heading">Public feeds</text>

  <path class="inner" d="M78 210 C117 208 211 212 250 209 L252 262 C207 265 120 261 79 264 Z"/>
  <text x="165" y="243" text-anchor="middle" class="label">Gemini</text>

  <path class="inner" d="M78 286 C122 283 208 288 250 285 L252 338 C207 341 120 337 79 340 Z"/>
  <text x="165" y="319" text-anchor="middle" class="label">Coinbase</text>

  <path class="inner" d="M78 362 C120 359 210 364 250 361 L252 414 C207 417 119 413 79 416 Z"/>
  <text x="165" y="395" text-anchor="middle" class="label">Binance.US</text>

  <!-- Exchange adapters -->
  <path class="box" d="M355 185 C415 181 572 187 630 184 L633 391 C573 396 417 389 357 394 Z"/>
  <path class="rough" d="M359 189 C420 185 568 191 626 188 L629 387 C569 392 421 385 361 390 Z"/>
  <text x="494" y="230" text-anchor="middle" class="heading">Exchange adapters</text>
  <line x1="390" y1="249" x2="596" y2="249" stroke="#a1a1aa" stroke-width="1.5" stroke-linecap="round"/>
  <text x="388" y="285" class="label">validate native sequence</text>
  <text x="388" y="323" class="label">recover gaps</text>
  <text x="388" y="361" class="label">normalize events</text>

  <!-- Canonical book gate -->
  <path class="accent" d="M705 168 C772 164 936 171 1000 167 L1003 410 C934 416 773 407 708 413 Z"/>
  <path d="M710 173 C779 169 931 176 995 172 L998 405 C930 411 780 402 713 408" fill="none" stroke="#2563eb" stroke-width="1" opacity="0.18" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="854" y="216" text-anchor="middle" class="heading accent-text">OrderBookManager</text>
  <text x="854" y="246" text-anchor="middle" class="small accent-text">canonical trust gate</text>
  <line x1="748" y1="266" x2="960" y2="266" stroke="#93c5fd" stroke-width="1.5" stroke-linecap="round"/>
  <text x="746" y="306" class="label">in-memory L2 books</text>
  <text x="746" y="345" class="label">continuous + fresh</text>
  <text x="746" y="384" class="label">complete + uncrossed</text>

  <!-- Detector -->
  <path class="box" d="M1080 185 C1141 181 1331 188 1390 184 L1393 391 C1330 396 1142 389 1082 394 Z"/>
  <path class="rough" d="M1084 189 C1147 185 1327 192 1386 188 L1389 387 C1325 392 1147 385 1086 390 Z"/>
  <text x="1236" y="230" text-anchor="middle" class="heading">ArbitrageDetector</text>
  <line x1="1120" y1="249" x2="1354" y2="249" stroke="#a1a1aa" stroke-width="1.5" stroke-linecap="round"/>
  <text x="1118" y="285" class="label">matching base / quote</text>
  <text x="1118" y="323" class="label">Decimal spread math</text>
  <text x="1118" y="361" class="label">theoretical only</text>

  <!-- Main path -->
  <path class="flow" d="M283 286 C310 284 327 287 352 285"/>
  <text x="318" y="270" text-anchor="middle" class="small">JSON</text>

  <path class="flow" d="M634 286 C660 283 677 287 702 285"/>
  <text x="668" y="270" text-anchor="middle" class="small">MarketEvent</text>

  <path class="flow" d="M1005 286 C1032 283 1050 287 1077 285"/>
  <text x="1041" y="270" text-anchor="middle" class="small">eligible books</text>

  <!-- API and dashboard branch -->
  <path class="box" d="M520 565 C575 561 738 568 790 564 L792 698 C735 702 577 696 522 701 Z"/>
  <path class="rough" d="M524 569 C582 565 733 572 786 568 L788 694 C731 698 581 692 526 697 Z"/>
  <text x="656" y="614" text-anchor="middle" class="heading">FastAPI</text>
  <text x="656" y="648" text-anchor="middle" class="label">REST + WebSocket</text>
  <text x="656" y="677" text-anchor="middle" class="small">bounded client queues</text>

  <path class="box" d="M95 565 C154 561 387 568 444 564 L446 698 C385 702 157 696 97 701 Z"/>
  <path class="rough" d="M99 569 C161 565 381 572 440 568 L442 694 C381 698 161 692 101 697 Z"/>
  <text x="270" y="614" text-anchor="middle" class="heading">React dashboard</text>
  <text x="270" y="648" text-anchor="middle" class="label">books · spreads · stats</text>
  <text x="270" y="677" text-anchor="middle" class="small">last-known state on reconnect</text>

  <path class="branch" d="M780 415 C759 468 710 515 674 561"/>
  <text x="704" y="500" text-anchor="middle" class="small">book + status</text>

  <path class="branch" d="M1115 397 C1044 469 900 541 795 606"/>
  <text x="938" y="518" text-anchor="middle" class="small">opportunities</text>

  <path class="flow" d="M517 633 C493 630 471 634 449 632"/>
  <text x="483" y="617" text-anchor="middle" class="small">live state</text>

  <!-- Persistence branch -->
  <path class="box" d="M952 565 C1000 561 1145 568 1192 564 L1194 698 C1144 702 1002 696 954 701 Z"/>
  <path class="rough" d="M956 569 C1006 565 1140 572 1188 568 L1190 694 C1140 698 1006 692 958 697 Z"/>
  <text x="1073" y="614" text-anchor="middle" class="heading">Persistence</text>
  <text x="1073" y="648" text-anchor="middle" class="label">bounded queue</text>
  <text x="1073" y="677" text-anchor="middle" class="small">batched writes</text>

  <path class="box" d="M1280 565 C1316 562 1418 568 1453 564 L1455 698 C1417 702 1318 696 1282 701 Z"/>
  <path class="rough" d="M1284 569 C1322 566 1413 572 1449 568 L1451 694 C1413 698 1322 692 1286 697 Z"/>
  <text x="1367" y="614" text-anchor="middle" class="heading">SQLite</text>
  <text x="1367" y="648" text-anchor="middle" class="label">opportunities</text>
  <text x="1367" y="677" text-anchor="middle" class="small">not order books</text>

  <path class="branch" d="M1238 397 C1229 464 1149 512 1090 561"/>
  <text x="1189" y="489" text-anchor="middle" class="small">opportunities</text>

  <path class="flow" d="M1197 633 C1226 630 1249 634 1277 632"/>
  <text x="1237" y="617" text-anchor="middle" class="small">batch</text>
</svg>
