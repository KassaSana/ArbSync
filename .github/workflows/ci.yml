name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: dashboard/package-lock.json
      - name: Install dashboard dependencies for hooks
        run: npm ci
        working-directory: dashboard
      - name: Reject coding-agent commit attribution
        run: python tools/check_commit_attribution.py ci
      - name: Install uv
        run: python -m pip install uv==0.12.10
      - name: Sync locked backend dependencies
        run: uv sync --locked --extra dev
      - name: Run backend tests with coverage
        run: uv run pytest --cov=arb.orderbook --cov=arb.detector --cov-fail-under=80
      - name: Run mypy
        run: uv run mypy --strict server/arb
      - name: Run ruff
        run: uv run ruff check server
      - name: Check backend formatting
        run: uv run ruff format --check server
      - name: Exercise repository hooks
        run: uv run pre-commit run --all-files

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: dashboard/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Lint dashboard
        run: npm run lint
      - name: Typecheck dashboard
        run: npm run typecheck
      - name: Test dashboard
        run: npm run test
      - name: Build dashboard
        run: npm run build
