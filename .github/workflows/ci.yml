name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: dashboard/package-lock.json
      - name: Install dashboard dependencies for hooks
        run: npm ci
        working-directory: dashboard
      - name: Reject coding-agent commit attribution
        run: python tools/check_commit_attribution.py ci
      - name: Install uv
        run: python -m pip install uv==0.12.10
      - name: Sync locked backend dependencies
        run: uv sync --locked --extra dev
      - name: Run backend tests with coverage
        run: uv run pytest --cov=arb.orderbook --cov=arb.detector --cov-fail-under=80
      - name: Run mypy
        run: uv run mypy --strict server/arb
      - name: Run ruff
        run: uv run ruff check server
      - name: Check backend formatting
        run: uv run ruff format --check server
      - name: Exercise repository hooks
        run: uv run pre-commit run --all-files
      - name: Check release content
        run: uv run python tools/check_release.py
      - name: Build candidate packages
        run: uv run python -m build --no-isolation --outdir var/release
      - name: Inspect and fingerprint candidate packages
        run: uv run python tools/check_release.py --artifacts var/release --output var/release/checks.json

  frontend:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: dashboard/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Lint dashboard
        run: npm run lint
      - name: Typecheck dashboard
        run: npm run typecheck
      - name: Test dashboard
        run: npm run test
      - name: Build dashboard
        run: npm run build
