name: Dependency audit

on:
  push:
  pull_request:
  schedule:
    - cron: "23 8 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Install uv and isolated audit tooling
        run: python -m pip install uv==0.12.10 -r tools/requirements-audit.txt
      - name: Export all locked third-party Python dependencies
        run: uv export --locked --all-extras --no-emit-project --format requirements.txt --output-file audit-requirements.txt
      - name: Audit locked Python dependencies
        run: python -m pip_audit --strict --disable-pip --no-deps --require-hashes --progress-spinner off -r audit-requirements.txt

  npm:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
      - name: Validate the locked dependency tree without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit
      - name: Audit runtime and development dependencies
        run: npm audit --include=dev --audit-level=low
